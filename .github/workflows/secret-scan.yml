name: secret-scan

on:
  push:
    branches: [main, master]
  pull_request:

# gitleaks-action lists PR commits and may comment; default GITHUB_TOKEN
# permissions are often too narrow (403 Resource not accessible by integration).
permissions:
  contents: read
  pull-requests: write

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # Pinned to gitleaks-action v2.3.9 (moving v2 tag at time of pin)
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Private orgs may need GITLEAKS_LICENSE — see README
