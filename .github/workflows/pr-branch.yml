name: PR branch

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  pull-requests: read

jobs:
  lint:
    name: PR branch
    runs-on: ubuntu-latest
    steps:
      - name: Validate conventional branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)/[a-z0-9]+(-[a-z0-9]+)*$'
          if [[ ! "$BRANCH" =~ $pattern ]]; then
            echo "Branch name must be type/short-description."
            echo "Allowed types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert."
            echo "Use lowercase words and hyphens after the slash."
            echo "Example: feat/ask-tomi-chat-list"
            echo "Got: $BRANCH"
            exit 1
          fi
